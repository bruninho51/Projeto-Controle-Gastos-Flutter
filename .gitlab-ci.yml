variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  FLUTTER_VERSION: "3.41.1"  # Atualize para a versão do seu projeto
  # Incrementar sempre que ci_cd/android.Dockerfile mudar (força nova imagem)
  ANDROID_IMAGE_REV: "1"
  ANDROID_IMAGE: "$CI_REGISTRY_IMAGE/android-builder:${FLUTTER_VERSION}-r${ANDROID_IMAGE_REV}"

stages:
  - release   # 1. semantic-release → gera versão e salva em version.txt
  - build     # 2. container + android em paralelo

# ─────────────────────────────────────────────────────────────
# STAGE 1 — Release
# Roda o semantic-release, que determina a versão, cria a tag
# e a release no GitLab. Salva a versão em version.txt para os
# stages seguintes via artifacts.
# ─────────────────────────────────────────────────────────────
release:
  stage: release
  environment: production
  image: node:20-alpine
  before_script:
    - apk add --no-cache git curl
    - npm install
    - chmod +x ./ci_cd/prepare_release.sh
  script:
    - npm run release
  artifacts:
    paths:
      - version.txt      # gerado pelo .releaserc (ver comentário abaixo)
    expire_in: 1 hour
  only:
    refs:
      - main

# ─────────────────────────────────────────────────────────────
# STAGE 1 — Imagem de build Android (paralelo com release)
# Gera a imagem com NDK/SDK pré-instalados. Se a tag já existe no
# registry, o job termina em segundos sem rebuild.
# Para forçar rebuild: rode a pipeline com REBUILD_ANDROID_IMAGE=true.
# ─────────────────────────────────────────────────────────────
android-image:
  stage: release
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ "$REBUILD_ANDROID_IMAGE" != "true" ] && docker manifest inspect "$ANDROID_IMAGE" > /dev/null 2>&1; then
        echo "✅ $ANDROID_IMAGE já existe, nada a fazer"
        exit 0
      fi
    - docker build --build-arg FLUTTER_VERSION="$FLUTTER_VERSION" -t "$ANDROID_IMAGE" -f ci_cd/android.Dockerfile ci_cd
    - docker push "$ANDROID_IMAGE"
  only:
    refs:
      - main

# ─────────────────────────────────────────────────────────────
# STAGE 2a — Container (paralelo com android)
## Lê version.txt, atualiza deployment.yml,
## faz build e push da imagem Docker.
# ─────────────────────────────────────────────────────────────
container:
  stage: build
  environment: production
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - apk add --no-cache git
  script:
    - chmod +x ./ci_cd/build_container.sh
    - ./ci_cd/build_container.sh
  only:
    refs:
      - main

# ─────────────────────────────────────────────────────────────
# STAGE 2b — Android (paralelo com container)
# Lê version.txt, compila o APK release e faz upload para o
# GitLab Generic Package Registry + Release Asset.
# ─────────────────────────────────────────────────────────────
android:
  stage: build
  environment: production
  image: $ANDROID_IMAGE
  needs:
    - release
    - android-image
  variables:
    # Caches dentro do projeto para o GitLab conseguir salvá-los
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  cache:
    key:
      files:
        - pubspec.lock
        - android/app/build.gradle
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - .pub-cache
  before_script:
    - flutter --version
  script:
    - chmod +x ./ci_cd/build_android.sh
    - ./ci_cd/build_android.sh
  only:
    refs:
      - main
